name: Docker

on:
  push:
    branches: [s1tbx]

jobs:

  docker:
    name: build and push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create image and tag names
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: mundialis/esa-snap
          tags: |
            type=sha,enable=true,priority=100,prefix=s1tbx-,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 's1tbx') }}
          flavor: |
            latest=auto

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: true
          pull: true
          context: .
          tags: ${{ steps.meta.outputs.tags }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  sbom-scan:
    permissions:
      contents: read
      security-events: write

    uses: mundialis/github-workflows/.github/workflows/sbom-vulnerability-scan.yml@main
    with:
      dockerfile: Dockerfile
